services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: siteblitz_db
    environment:
      POSTGRES_DB: siteblitz_leads
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for background jobs
  redis:
    image: redis:7-alpine
    container_name: siteblitz_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siteblitz_api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/siteblitz_leads
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/siteblitz_leads
      REDIS_URL: redis://redis:6379/0
      API_DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
