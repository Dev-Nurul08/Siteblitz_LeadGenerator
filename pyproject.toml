[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "siteblitz-lead-intelligence"
version = "0.1.0"
description = "Lead Intelligence OS — Internal sales intelligence and customer acquisition platform"
requires-python = ">=3.11"
dependencies = [
    # API Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.9",
    # Background Jobs
    "redis>=5.0.0",
    "rq>=1.16.0",
    # HTTP & Crawling
    "httpx>=0.27.0",
    "scrapy>=2.11.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Validation & Settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Data Processing
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    # Geospatial
    "geopy>=2.4.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "structlog>=24.0.0",
    "tenacity>=8.5.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
phase2 = [
    "playwright>=1.45.0",
]
phase3 = [
    "dnspython>=2.6.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
